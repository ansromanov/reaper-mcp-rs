name: Release

# Publishes a GitHub release when a release pull request lands on main. The pull request
# comes from scripts/release.sh: it sets the version in Cargo.toml and regenerates
# CHANGELOG.md, so this workflow commits nothing and main stays protected. Run it by hand
# to retry a failed release of the version in Cargo.toml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: plan
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "$HEAD_MESSAGE" != "chore(release): v$version"* ]]; then
            echo "Not a release commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, run: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, run: true }
          - { os: macos-latest, target: aarch64-apple-darwin, run: true }
          - { os: macos-latest, target: x86_64-apple-darwin, run: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, run: true }
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          exe=reaper-mcp-rs
          [[ "${{ runner.os }}" == "Windows" ]] && exe=reaper-mcp-rs.exe
          if [[ "${{ matrix.run }}" == "true" ]]; then
            "target/${{ matrix.target }}/release/$exe" --version
          fi
          stage=dist/reaper-mcp-rs
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/$exe" "$stage/"
          cp -R lua scripts "$stage/"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "reaper-mcp-rs-${{ matrix.target }}.zip" reaper-mcp-rs >/dev/null
          else
            tar -czf "reaper-mcp-rs-${{ matrix.target }}.tar.gz" reaper-mcp-rs
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: reaper-mcp-rs-${{ matrix.target }}
          path: dist/reaper-mcp-rs-${{ matrix.target }}.*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.0

      - name: Release notes
        run: |
          git-cliff --unreleased --tag "v${{ needs.plan.outputs.version }}" --strip header --output notes.md
          # The release page has its own title.
          sed -i '1{/^## \[/d}' notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: artifacts/*
