name: Docs

# Builds the mdBook in docs/ on every pull request, and publishes it to GitHub Pages
# when docs change on main.
on:
  pull_request:
    paths: [docs/**, ROADMAP.md, CHANGELOG.md, .github/workflows/pages.yml]
  push:
    branches: [main]
    paths: [docs/**, ROADMAP.md, CHANGELOG.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.3

      - name: Build
        run: mdbook build docs

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
