# git-cliff: CHANGELOG.md and release notes from Conventional Commits.
# Features bump the minor version, fixes and performance work the patch version.

[changelog]
header = """
# Changelog

All notable changes to reaper-mcp-rs. Generated by git-cliff from Conventional Commits.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
no_increment_regex = "^(build|chore|ci|docs|refactor|style|test)(\\([^)]*\\))?:"

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking Changes", bump = "major" },
  { body = "BREAKING CHANGE", group = "Breaking Changes", bump = "major" },
  { message = "^feat", group = "Features", bump = "minor" },
  { message = "^fix", group = "Bug Fixes", bump = "patch" },
  { message = "^perf", group = "Performance", bump = "patch" },
  { message = "^Initial public release", group = "Features" },
  { message = "^.*", skip = true },
]
