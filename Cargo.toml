[package]
name = "reaper-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "MCP server for controlling REAPER through a local Lua bridge"
license = "MIT"
repository = "https://github.com/ansromanov/reaper-mcp-rs"
readme = "README.md"
keywords = ["mcp", "reaper", "daw", "audio", "music"]

[dependencies]
anyhow = "1"
directories = "6"
hound = "3.5.1"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros", "schemars"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
